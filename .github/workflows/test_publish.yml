name: "Test and publish"

on:
  push:

# cartucho is a path dependency (../cartucho), so both repositories are
# checked out side by side and every command runs inside carton
defaults:
  run:
    working-directory: "carton"

jobs:
  test:
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.15"

    env:
      UV_PYTHON: "${{ matrix.python-version }}"

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7"
        with:
          path: "carton"

      - name: "Checkout cartucho"
        uses: "actions/checkout@v7"
        with:
          repository: "pablerass/cartucho"
          path: "cartucho"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.3"
        with:
          enable-cache: true

      - name: "Install Dependencies"
        run: |
          uv sync --locked

      - name: "Lint"
        run: |
          make lint

      - name: "Type Check"
        run: |
          make type-check

      - name: "Test"
        run: |
          make test-coverage

  publish:
    runs-on: "ubuntu-latest"
    needs: "test"
    if: "startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: write

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7"
        with:
          path: "carton"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.3"

      - name: "Build"
        run: |
          make build

      - name: "Publish to Pypi"
        run: |
          uv publish
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.PYPI_API_TOKEN }}"

      - name: "Create Release"
        uses: "softprops/action-gh-release@v3"
        with:
          files: "carton/dist/*"
          prerelease: true
