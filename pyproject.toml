[project]
name = "carton"
version = "0.1.0a0"
description = "A tool to create print and play card games"
readme = "README.md"
authors = [{name = "Pablo Muñoz", email = "pablerass@gmail.com"}]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords = ["card", "board", "game"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Games/Entertainment :: Board Games",
  "Typing :: Typed"
]
requires-python = ">=3.14"
dependencies = [
  "cartucho",
  "pandas",
  "fastapi",
  "aiohttp",
  "aiometer",
  "sqlmodel",
  "pydantic",
  "xmltodict",
]

[project.urls]
Homepage = "https://github.com/pablerass/carton"

[project.scripts]
carton = "carton.__main__:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-httpx",
  "pytest-asyncio",
  "pytest-unordered",
  "flake8",
  "coverage",
  "mypy",
  "types-setuptools",
  "types-xmltodict",
  "pandas-stubs",
]
dev = [
  {include-group = "test"},
  "bumpver",
  "ipython",
  "ipdb",
  "uvicorn",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
