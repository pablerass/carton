[project]
name = "carton"
version = "0.1.0a0"
description = "A tool to create print and play card games"
readme = "README.md"
authors = [{name = "Pablo Muñoz", email = "pablerass@gmail.com"}]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords = ["card", "board", "game"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Games/Entertainment :: Board Games",
  "Typing :: Typed"
]
requires-python = ">=3.14"
dependencies = [
  "cartucho",
  "fastapi",
  "aiohttp",
  "httpx",
  "sqlmodel",
  "pydantic",
  "xmltodict",
  "uvicorn",
]

[project.urls]
Homepage = "https://github.com/pablerass/carton"

[project.scripts]
carton = "carton.__main__:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-httpx",
  "pytest-asyncio",
  "pytest-unordered",
  "coverage",
  "types-setuptools",
  "types-xmltodict",
  "ty",
  "ruff",
]
dev = [
  {include-group = "test"},
  "bumpver",
  "ipython",
  "ipdb",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "conftest.py", "build/*", "dist/*", "docs/*", "tests/*", ".tox/*"]

[tool.coverage.report]
fail_under = 70

[tool.bumpver]
current_version = "v0.1.0a0"
version_pattern = "vMAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
  '^current_version = "{version}"$',
  '^version = "{pep440_version}"$',
]
"carton/__init__.py" = ["__version__ = '{pep440_version}'"]

[tool.uv.sources]
cartucho = { path = "../cartucho", editable = true }
